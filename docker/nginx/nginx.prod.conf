# nginx.prod.conf - News Origin Production Reverse Proxy
# Version: 0.4.0 - proxy_cache + direct static file serving

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # Docker 내부 DNS resolver - 컨테이너 재시작 시 IP 재해석 (502 방지)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;

    # Proxy cache for read-only API endpoints
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:2m
                     max_size=50m inactive=10m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

        # ── Cached Trends API endpoints (read-only, safe to cache) ──

        location /api/trends/hot {
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$request_uri";
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=api burst=50 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /api/trends/stats {
            proxy_cache api_cache;
            proxy_cache_valid 200 3m;
            proxy_cache_key "$request_uri";
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=api burst=50 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /api/trends/article-trends {
            proxy_cache api_cache;
            proxy_cache_valid 200 3m;
            proxy_cache_key "$request_uri";
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=api burst=50 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /api/trends/recent-articles {
            proxy_cache api_cache;
            proxy_cache_valid 200 2m;
            proxy_cache_key "$request_uri";
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            limit_req zone=api burst=50 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Non-cached API endpoints ──

        # SSE endpoint (must be before generic /api/)
        location /api/trends/events {
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # Generic API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Search/track with stricter rate limit
        location /api/articles/track {
            limit_req zone=search burst=10 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location /api/search/ {
            limit_req zone=search burst=10 nodelay;
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # OpenAPI docs
        location /docs {
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
        }

        location /redoc {
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend_url http://backend:8000;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
        }

        # ── Frontend: direct static file serving ──

        # Hashed static assets - aggressive long-term cache
        location /assets/ {
            alias /usr/share/nginx/frontend/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            gzip_static on;
        }

        # SPA fallback
        location / {
            root /usr/share/nginx/frontend;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
