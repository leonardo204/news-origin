# Qdrant Configuration - News Origin
# Version: 0.2.0

log_level: INFO

storage:
  storage_path: /qdrant/storage
  optimizers:
    default_segment_number: 2
    memmap_threshold_kb: 1000
  performance:
    max_search_threads: 1

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  enable_cors: true
